<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Illustration only: no brand logo (Bose is a trademark of Bose Corporation, not affiliated). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14181f"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5aa9e6" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#2f6fb5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f6fb5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#16191e"/>
    </linearGradient>
    <linearGradient id="speaker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ecf1"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
    <pattern id="grille" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <circle cx="400" cy="240" r="320" fill="url(#halo)"/>

  <!-- Sound waves -->
  <g fill="none" stroke="#7cc4ff" stroke-linecap="round" opacity="0.55">
    <path d="M 400 120 a 120 120 0 0 1 0 0" stroke-width="0"/>
    <path d="M 330 150 q 70 -60 140 0" stroke-width="6"/>
    <path d="M 300 120 q 100 -90 200 0" stroke-width="5" opacity="0.7"/>
    <path d="M 270 90 q 130 -120 260 0" stroke-width="4" opacity="0.45"/>
  </g>

  <!-- A smart speaker -->
  <rect x="520" y="150" width="150" height="200" rx="46" fill="url(#speaker)"/>
  <rect x="534" y="200" width="122" height="136" rx="36" fill="url(#grille)"/>
  <circle cx="595" cy="172" r="5" fill="#2f6fb5"/>

  <!-- A soundbar -->
  <rect x="90" y="300" width="460" height="64" rx="32" fill="url(#bar)"/>
  <rect x="110" y="312" width="420" height="40" rx="20" fill="url(#grille)" opacity="0.9"/>
  <rect x="300" y="356" width="40" height="4" rx="2" fill="#5aa9e6"/>

  <!-- A portable speaker -->
  <rect x="690" y="260" width="70" height="110" rx="24" fill="#2b313a"/>
  <rect x="698" y="290" width="54" height="70" rx="18" fill="url(#grille)"/>
  <rect x="715" y="248" width="20" height="16" rx="6" fill="none" stroke="#2b313a" stroke-width="5"/>

  <!-- Title -->
  <text x="400" y="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle">Bose for Gladys</text>
  <text x="400" y="482" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#b9c4d2" text-anchor="middle">Smart speakers &amp; soundbars on your local network · unofficial</text>
</svg>
