<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Discovery, creation, command and state cycle of the Bose integration (illustration)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="980" y="632" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#24303c">
    <rect x="30" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="100" y="44">User</text>
    <rect x="230" y="20" width="140" height="36" rx="8" fill="#eef4fb" stroke="#2979d6"/><text x="300" y="44">Gladys</text>
    <rect x="430" y="20" width="140" height="36" rx="8" fill="#f4f6f8" stroke="#46505a"/><text x="500" y="44">Integration</text>
    <rect x="630" y="20" width="140" height="36" rx="8" fill="#fff6e8" stroke="#d48a1c"/><text x="700" y="44">Bose account</text>
    <rect x="830" y="20" width="140" height="36" rx="8" fill="#f0f7f1" stroke="#2e8b57"/><text x="900" y="44">Speaker</text>
  </g>
  <g stroke="#c4ccd4" stroke-dasharray="4 4">
    <line x1="100" y1="56" x2="100" y2="610"/><line x1="300" y1="56" x2="300" y2="610"/>
    <line x1="500" y1="56" x2="500" y2="610"/><line x1="700" y1="56" x2="700" y2="610"/>
    <line x1="900" y1="56" x2="900" y2="610"/>
  </g>
  <g stroke="#46505a" stroke-width="1.6" marker-end="url(#a)">
    <line x1="500" y1="90" x2="696" y2="90"/>
    <line x1="700" y1="120" x2="504" y2="120"/>
    <line x1="100" y1="160" x2="296" y2="160"/>
    <line x1="300" y1="190" x2="496" y2="190"/>
    <line x1="500" y1="220" x2="304" y2="220"/>
    <line x1="300" y1="250" x2="496" y2="250"/>
    <line x1="500" y1="280" x2="896" y2="280"/>
    <line x1="900" y1="310" x2="504" y2="310"/>
    <line x1="500" y1="340" x2="304" y2="340"/>
    <line x1="100" y1="380" x2="296" y2="380"/>
    <line x1="300" y1="410" x2="496" y2="410"/>
    <line x1="500" y1="440" x2="896" y2="440"/>
    <line x1="100" y1="490" x2="296" y2="490"/>
    <line x1="300" y1="520" x2="496" y2="520"/>
    <line x1="500" y1="550" x2="896" y2="550"/>
    <line x1="900" y1="580" x2="504" y2="580"/>
    <line x1="500" y1="600" x2="304" y2="600"/>
  </g>
  <g font-size="13" fill="#24303c">
    <text x="510" y="84">sign in once (e-mail, password)</text>
    <text x="510" y="114">token, then refreshed before it expires</text>
    <text x="110" y="154">Discover tab: Scan</text>
    <text x="310" y="184">scan request</text>
    <text x="310" y="214">scanNetwork: mDNS “_bose-passport._tcp”</text>
    <text x="310" y="244">raw answers: address, GUID (TXT)</text>
    <text x="510" y="274">wss :8082 + token: capabilities, info, state</text>
    <text x="510" y="304">answers (then the connection is closed)</text>
    <text x="310" y="334">discovered speakers (features of each model)</text>
    <text x="110" y="374">Discover tab: Add</text>
    <text x="310" y="404">device created</text>
    <text x="510" y="434">connect, PUT /subscription, read everything</text>
    <text x="110" y="484">sets the volume to 25</text>
    <text x="310" y="514">setValue(volume, 25)</text>
    <text x="510" y="544">PUT /audio/volume { value: 25 }</text>
    <text x="510" y="574">NOTIFY /audio/volume (also for changes made in the Bose app)</text>
    <text x="310" y="594">states (changes only)</text>
  </g>
</svg>
